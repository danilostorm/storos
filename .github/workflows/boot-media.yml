name: Bootable media

on:
  workflow_dispatch:
  push:
    branches: [phase0/gpu-feasibility]
    paths:
      - Containerfile
      - bin/**
      - image/**
      - scripts/**
      - src/**
      - .github/workflows/boot-media.yml
  pull_request:
    paths:
      - Containerfile
      - bin/**
      - image/**
      - scripts/**
      - src/**
      - .github/workflows/boot-media.yml

permissions:
  contents: read

concurrency:
  group: boot-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qcow2:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install image and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86 qemu-utils ovmf

      - name: Start ephemeral local registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storos-registry"
          docker run --detach --rm \
            --name storos-registry \
            --publish 5000:5000 \
            --volume "$RUNNER_TEMP/storos-registry:/var/lib/registry" \
            registry:2

      - name: Prepare build variables
        shell: bash
        run: |
          set -euo pipefail
          echo "STOROS_IMAGE=localhost:5000/storos-ci:boot-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BIB_CHOWN=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          echo "QCOW2=$GITHUB_WORKSPACE/output/qcow2/disk.qcow2" >> "$GITHUB_ENV"

      - name: Build and stage bootc image
        shell: bash
        run: |
          set -euo pipefail
          base_ref=$(sed -n 's/^ARG BASE_IMAGE=//p' Containerfile)
          test -n "$base_ref"
          docker pull "$base_ref"
          docker build \
            --file Containerfile \
            --build-arg "BASE_IMAGE=$base_ref" \
            --build-arg "STOROS_REVISION=$GITHUB_SHA" \
            --tag "$STOROS_IMAGE" \
            .

          docker run --rm --network none "$STOROS_IMAGE" bootc container lint
          docker run --rm --network none --entrypoint bash "$STOROS_IMAGE" /usr/libexec/storos/check-image.sh
          docker push "$STOROS_IMAGE"

      - name: Prepare rootful Podman storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          cat <<'EOF' | sudo tee /etc/containers/storage.conf >/dev/null
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF
          sudo podman pull quay.io/centos-bootc/bootc-image-builder:latest
          sudo podman pull --tls-verify=false "$STOROS_IMAGE"

      - name: Build StorOS QCOW2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "$GITHUB_WORKSPACE/output:/output" \
            --volume "$GITHUB_WORKSPACE/image/bootc-image-builder.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --output /output \
            --chown "$BIB_CHOWN" \
            --rootfs xfs \
            --type qcow2 \
            "$STOROS_IMAGE"

      - name: Inspect QCOW2
        shell: bash
        run: |
          set -euo pipefail
          test -s "$QCOW2"
          qemu-img info "$QCOW2"
          sha256sum "$QCOW2" | tee storos-qcow2.sha256

      - name: Boot QCOW2 and wait for StorOS agent
        shell: bash
        run: |
          set -euo pipefail

          firmware_code=""
          firmware_vars=""
          for pair in \
            "/usr/share/OVMF/OVMF_CODE_4M.fd:/usr/share/OVMF/OVMF_VARS_4M.fd" \
            "/usr/share/OVMF/OVMF_CODE.fd:/usr/share/OVMF/OVMF_VARS.fd"; do
            code=${pair%%:*}
            vars=${pair#*:}
            if [[ -r "$code" && -r "$vars" ]]; then
              firmware_code="$code"
              firmware_vars="$vars"
              break
            fi
          done

          if [[ -z "$firmware_code" || -z "$firmware_vars" ]]; then
            echo "No compatible OVMF CODE/VARS pair found." >&2
            find /usr/share/OVMF -maxdepth 1 -type f -o -type l 2>/dev/null | sort || true
            exit 1
          fi

          vars_copy="$RUNNER_TEMP/storos-OVMF_VARS.fd"
          cp --dereference "$firmware_vars" "$vars_copy"
          chmod u+w "$vars_copy"
          test -s "$firmware_code"
          test -s "$vars_copy"

          qemu_args=(
            -machine q35,accel=tcg
            -cpu max
            -smp 2
            -m 2048
            -drive "if=pflash,format=raw,unit=0,readonly=on,file=$firmware_code"
            -drive "if=pflash,format=raw,unit=1,file=$vars_copy"
            -drive "file=$QCOW2,format=qcow2,if=virtio"
            -display none
            -monitor none
            -serial stdio
            -no-reboot
          )

          set +e
          timeout 300s qemu-system-x86_64 "${qemu_args[@]}" > boot-console.log 2>&1
          qemu_rc=$?
          set -e

          cat boot-console.log
          if [[ "$qemu_rc" -ne 0 && "$qemu_rc" -ne 124 ]]; then
            echo "QEMU exited unexpectedly with code $qemu_rc" >&2
            exit "$qemu_rc"
          fi

          grep -q 'StorOS read-only host and VM observer' boot-console.log
          printf '%s\n' 'STOROS_BOOT_OK: systemd reached storos-agent.service' | tee boot-proof.txt

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storos-boot-evidence
          path: |
            storos-qcow2.sha256
            boot-console.log
            boot-proof.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bootable StorOS QCOW2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storos-qcow2
          path: output/qcow2/disk.qcow2
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
